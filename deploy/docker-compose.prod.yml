# Production overlay example for OVHcloud VPS.
# Usage: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build

services:
  api:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    restart: always

  redis:
    restart: always

  minio:
    restart: always
